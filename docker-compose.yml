name: mathboard

x-backend-build: &backend-build
  context: ./src
  target: runtime

x-backend-env: &backend-env
  DATABASE_URL: postgresql://mathboard:${POSTGRES_PASSWORD:-mathboard-dev}@postgres:5432/mathboard
  SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me}
  APP_URL: ${APP_URL:-http://localhost:12000}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mathboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mathboard-dev}
      POSTGRES_DB: mathboard
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathboard -d mathboard"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: *backend-build
    image: mathboard-backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: *backend-build
    image: mathboard-backend
    environment:
      <<: *backend-env
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      WS_ACCEPT_LOGIN_TOKEN: ${WS_ACCEPT_LOGIN_TOKEN:-1}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      SIGNUP_MAX_ATTEMPTS: ${SIGNUP_MAX_ATTEMPTS:-}
    ports:
      - "127.0.0.1:12001:12001"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:12001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./app
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:12001}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:12001}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:12000}
    image: mathboard-frontend
    ports:
      - "127.0.0.1:12000:12000"
    depends_on:
      backend:
        condition: service_healthy

  backend-test:
    profiles: ["test"]
    build:
      context: ./src
      target: test
    environment:
      TEST_DATABASE_URL: postgresql://mathboard:${POSTGRES_PASSWORD:-mathboard-dev}@postgres:5432/mathboard_test
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
